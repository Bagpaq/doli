<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CryptoMiko: HODL Tycoon</title>
<style>
/* ============================================================
   CRYPTOMIKO: HODL TYCOON — STYLES
   kawaii-cyberpunk-fintech: deep indigo base, hot-pink / mint /
   gold accents, rounded glossy everything.
   ============================================================ */
:root{
  --bg1:#0f1536; --bg2:#1b2158; --bg3:#232a6e;
  --card:rgba(34,42,96,.88); --card2:rgba(26,32,78,.92);
  --line:rgba(255,255,255,.09);
  --pink:#ff6fb5; --pink2:#ff9dce; --mint:#3df0b8; --mint2:#8ffce0;
  --gold:#ffd75e; --gold2:#ffe9a8; --blue:#6fa8ff; --purple:#b48cff;
  --red:#ff7a8a; --text:#eef2ff; --dim:#9aa6d8; --dark:#0b0f28;
  --rar-common:#9aa3b5; --rar-rare:#58a6ff; --rar-epic:#b48cff; --rar-legendary:#ffd75e;
  --nav-h:60px; --hud-h:96px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Trebuchet MS","Comic Sans MS","Segoe UI Rounded","Hiragino Maru Gothic ProN","Varela Round",system-ui,sans-serif;
  color:var(--text);
  background:radial-gradient(120% 90% at 50% -10%,var(--bg3) 0%,var(--bg2) 45%,var(--bg1) 100%) fixed;
  user-select:none;-webkit-user-select:none;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font-family:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-weight:700}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}

/* ---------- TOP HUD ---------- */
#hud{
  flex:0 0 auto;padding:8px 10px 6px;display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(180deg,rgba(11,15,40,.92),rgba(11,15,40,.55) 80%,transparent);
  z-index:30;
}
#hudTop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid var(--line);font-size:.86rem;box-shadow:0 2px 6px rgba(0,0,0,.25);
  white-space:nowrap;
}
.chip .ico{font-size:1rem;filter:drop-shadow(0 0 4px rgba(255,255,255,.35))}
.chip.coin .num{color:var(--gold2)}
.chip.dh .num{color:#c8f4ff}
.chip.gem .num{color:var(--pink2)}
.chip.shard .num{color:var(--mint2)}
.chip.pulse{animation:chipPulse .5s ease}
@keyframes chipPulse{40%{transform:scale(1.12);box-shadow:0 0 14px rgba(61,240,184,.6)}}
.chip.buff{border-color:var(--gold);animation:glowPulse 1.2s infinite}
.chip.buff .num{color:var(--gold2)}

/* Golden Candle — rare tappable flying bonus */
.goldCandle{position:absolute;z-index:65;width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.7rem;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#f5b93a 70%,#c78a12);
  border:2px solid #ffe9a8;box-shadow:0 0 18px rgba(255,215,94,.9);
  animation:candleFly 9s linear forwards}
.goldCandle i{font-style:normal;animation:candleBob 1.1s ease-in-out infinite;display:block}
@keyframes candleFly{from{left:-60px}to{left:calc(100% + 10px)}}
@keyframes candleBob{50%{transform:translateY(-12px) rotate(9deg)}}
#settingsBtn{margin-left:auto;font-size:1.25rem;width:36px;height:36px;border-radius:12px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .2s}
#settingsBtn:active{transform:rotate(90deg) scale(.9)}
#energyRow{display:flex;align-items:center;gap:8px}
#energyBarWrap{flex:1;height:18px;border-radius:999px;background:rgba(0,0,0,.4);
  border:1px solid var(--line);overflow:hidden;position:relative}
#energyBar{height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#ffd75e,#ffb84d,#ff9d6f);
  box-shadow:0 0 12px rgba(255,215,94,.55);transition:width .25s}
#energyTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#energyRegen{font-size:.72rem;color:var(--gold2);white-space:nowrap}

/* ---------- SCREENS ---------- */
#screens{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 10px calc(var(--nav-h) + 18px);scroll-behavior:smooth}
.screen{display:none;animation:screenIn .22s ease}
.screen.active{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screenTitle{font-size:1.15rem;font-weight:900;margin:8px 2px 2px;display:flex;align-items:center;gap:8px}
.screenTitle small{font-size:.72rem;color:var(--dim);font-weight:600}
.sub{color:var(--dim);font-size:.78rem;margin:0 2px 8px}

/* ---------- CARDS ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:10px;margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.28);
}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:38%;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent);pointer-events:none;border-radius:18px 18px 0 0}
.cardTitle{font-weight:900;font-size:.95rem;display:flex;align-items:center;gap:6px}
.tag{font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
.tag.soon{background:rgba(255,255,255,.1);color:var(--dim)}
.tag.live{background:linear-gradient(90deg,#ff6fb5,#ff9d6f);color:#fff;animation:glowPulse 1.4s infinite}
.tag.new{background:var(--mint);color:#063}
@keyframes glowPulse{50%{filter:brightness(1.35)}}

/* ---------- BUTTONS ---------- */
.btn{
  border-radius:14px;padding:8px 14px;font-weight:900;font-size:.85rem;
  background:linear-gradient(180deg,#3f4a9e,#2c3480);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .08s,filter .15s;text-align:center;
}
.btn:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.mint{background:linear-gradient(180deg,#3df0b8,#18b985);color:#04351f;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.pink{background:linear-gradient(180deg,#ff8ac2,#f0489c);color:#fff}
.btn.gold{background:linear-gradient(180deg,#ffe089,#f5b93a);color:#5c3d00}
.btn.blue{background:linear-gradient(180deg,#7fb2ff,#4a7de0);color:#fff}
.btn.ghost{background:rgba(255,255,255,.07)}
.btn:disabled,.btn.off{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
.btn.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.cost{font-size:.72rem;font-weight:800;opacity:.95;display:block}

/* ---------- RIG CARD ---------- */
.rig{display:grid;grid-template-columns:78px 1fr 86px;gap:8px;align-items:center}
.rigArtWrap{width:78px;display:flex;flex-direction:column;align-items:center;gap:3px}
.rigArt{width:72px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(80% 80% at 50% 30%,rgba(255,255,255,.14),rgba(0,0,0,.28));
  border:1px solid var(--line);position:relative;overflow:visible}
.rigArt svg{width:60px;height:48px;overflow:visible}
.rigArt.tier1 svg{filter:drop-shadow(0 0 6px rgba(61,240,184,.7))}
.rigArt.tier2{background:radial-gradient(80% 80% at 50% 30%,rgba(255,111,181,.30),rgba(0,0,0,.3));border-color:var(--pink)}
.rigArt.tier2 svg{filter:drop-shadow(0 0 8px rgba(255,111,181,.9)) drop-shadow(0 0 16px rgba(255,215,94,.5))}
.rigCnt{font-size:.7rem;font-weight:900;color:var(--gold2);background:rgba(0,0,0,.35);
  padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.opSlot{margin-top:2px;height:44px;display:flex;align-items:center;justify-content:center;position:relative}
.opSlot .chibi{width:40px;height:44px}
.opSlot .noOp{font-size:.6rem;color:var(--dim);text-align:center;line-height:1.15}
.rigMid{min-width:0}
.rigName{font-weight:900;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rigProfit{font-size:.76rem;color:var(--mint2);margin:1px 0 3px}
.rigProfit .per{color:var(--dim);font-weight:600}
.msBarWrap{height:8px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;margin:3px 0 5px;border:1px solid rgba(255,255,255,.06)}
.msBar{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .2s}
.msLabel{font-size:.62rem;color:var(--dim);margin-bottom:4px}
.stages{display:flex;flex-direction:column;gap:3px}
.stage{display:flex;align-items:center;gap:5px;font-size:.68rem}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 5px currentColor}
.dot.g{background:var(--mint);color:var(--mint)}
.dot.y{background:var(--gold);color:var(--gold)}
.dot.r{background:var(--red);color:var(--red);animation:glowPulse 1s infinite}
.stName{width:70px;color:var(--dim);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.stLv{width:34px;font-weight:800}
.stUp{margin-left:auto;font-size:.62rem;padding:2px 8px;border-radius:9px;font-weight:900;
  background:linear-gradient(180deg,#3f4a9e,#2c3480);border:1px solid rgba(255,255,255,.14);white-space:nowrap}
.stUp.can{background:linear-gradient(180deg,#57e6b5,#20a87c);color:#04351f}
.stUp.off{filter:grayscale(.8) brightness(.65)}
.rigRight{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.tapBtn{
  width:64px;height:64px;border-radius:50%;position:relative;font-size:1.5rem;
  background:radial-gradient(70% 70% at 50% 35%,#ff9dce,#f0489c 70%,#c22d7a);
  border:2px solid rgba(255,255,255,.35);box-shadow:0 4px 0 #8e1f58,0 0 16px rgba(255,111,181,.4);
  transition:transform .06s;display:flex;align-items:center;justify-content:center;
}
.tapBtn:active{transform:scale(.88)}
.tapBtn .ring{position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(var(--mint) calc(var(--p,0)*1%), rgba(255,255,255,.08) 0);
  -webkit-mask:radial-gradient(circle,transparent 64%,#000 66%);mask:radial-gradient(circle,transparent 64%,#000 66%)}
.tapBtn.ready{animation:readyBob 1s infinite}
@keyframes readyBob{50%{box-shadow:0 4px 0 #8e1f58,0 0 26px rgba(61,240,184,.8)}}
.tapBtn.auto{background:radial-gradient(70% 70% at 50% 35%,#8ffce0,#18b985 70%,#0d7d59);box-shadow:0 4px 0 #07543b,0 0 14px rgba(61,240,184,.4)}
.buyBtn{width:86px;padding:6px 4px;border-radius:12px;font-size:.72rem}
.abilBtn{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;font-size:.8rem;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#f5b93a);border:1px solid #fff;
  box-shadow:0 0 8px rgba(255,215,94,.8);display:flex;align-items:center;justify-content:center;z-index:2}
.abilBtn.cd{background:rgba(30,36,80,.9);box-shadow:none;color:var(--dim);font-size:.55rem;font-weight:900}
.rigLocked{display:flex;align-items:center;gap:10px;opacity:.95}
.rigLocked .rigArt{filter:grayscale(1) brightness(.6)}

/* buy amount toggle */
#buyAmtRow{display:flex;gap:6px;margin:6px 0 10px;align-items:center}
.amtBtn{flex:1;padding:6px 0;border-radius:11px;font-weight:900;font-size:.78rem;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim)}
.amtBtn.sel{background:linear-gradient(180deg,#7fb2ff,#4a7de0);color:#fff;border-color:rgba(255,255,255,.4)}

/* ---------- CHIBI CHARACTERS ---------- */
.chibi{display:inline-block;width:64px;height:70px;animation:idleBob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes idleBob{50%{transform:translateY(-2px) scale(1.02,0.98)}}
.chibi.happy{animation:happyBounce .5s ease}
@keyframes happyBounce{30%{transform:translateY(-7px) scale(1.08,.92)}60%{transform:translateY(0) scale(.95,1.05)}}
.chibi.cast{animation:castSpin .7s ease}
@keyframes castSpin{40%{transform:translateY(-9px) rotate(-8deg) scale(1.15)}70%{transform:rotate(6deg)}}
.opCard{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center}
.opFrame{width:62px;height:68px;border-radius:15px;display:flex;align-items:flex-end;justify-content:center;
  background:radial-gradient(90% 90% at 50% 20%,rgba(255,255,255,.14),rgba(0,0,0,.3));
  border:2px solid var(--rar-common);position:relative;overflow:hidden}
.opFrame .chibi{width:52px;height:58px}
.opFrame.rar-common{border-color:var(--rar-common)}
.opFrame.rar-rare{border-color:var(--rar-rare);box-shadow:0 0 8px rgba(88,166,255,.5)}
.opFrame.rar-epic{border-color:var(--rar-epic);box-shadow:0 0 10px rgba(180,140,255,.6)}
.opFrame.rar-legendary{border-color:var(--rar-legendary);box-shadow:0 0 12px rgba(255,215,94,.7)}
.opFrame.rar-mythic{border:2px solid transparent;background:
  linear-gradient(rgba(20,25,60,.9),rgba(20,25,60,.9)) padding-box,
  linear-gradient(120deg,#ff6fb5,#ffd75e,#3df0b8,#6fa8ff,#b48cff,#ff6fb5) border-box;
  animation:mythicShift 3s linear infinite;background-size:auto,300% 300%;box-shadow:0 0 14px rgba(255,180,255,.65)}
@keyframes mythicShift{to{background-position:0 0,300% 0}}
.rarName{font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.rar-common .rarName,.rarName.rar-common{color:var(--rar-common)}
.rarName.rar-rare{color:var(--rar-rare)} .rarName.rar-epic{color:var(--rar-epic)}
.rarName.rar-legendary{color:var(--rar-legendary)} .rarName.rar-mythic{background:linear-gradient(90deg,#ff6fb5,#ffd75e,#3df0b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.opInfo{min-width:0}
.opName{font-weight:900;font-size:.9rem}
.opDesc{font-size:.7rem;color:var(--dim);margin:2px 0}
.opAbil{font-size:.72rem;color:var(--gold2);font-weight:700}
.opBtns{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:96px}
.skinRow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.skinDot{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:.9rem;background:rgba(0,0,0,.3)}
.skinDot.sel{border-color:var(--mint);box-shadow:0 0 8px rgba(61,240,184,.6)}

/* ---------- FLOATING NUMBERS / FX ---------- */
#floats{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.floatTxt{position:absolute;font-weight:900;font-size:1rem;color:var(--mint2);
  text-shadow:0 0 8px rgba(61,240,184,.8),0 2px 2px rgba(0,0,0,.6);
  animation:floatUp 1s ease-out forwards;white-space:nowrap}
.floatTxt.gold{color:var(--gold2);text-shadow:0 0 10px rgba(255,215,94,.9),0 2px 2px rgba(0,0,0,.6);font-size:1.2rem}
@keyframes floatUp{from{opacity:1;transform:translateY(0) scale(.8)}30%{transform:translateY(-18px) scale(1.1)}to{opacity:0;transform:translateY(-52px) scale(1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#app.shakeLite{animation:shakeLite .4s}
@keyframes shakeLite{20%{transform:translate(2px,-2px)}40%{transform:translate(-2px,2px)}60%{transform:translate(1px,-1px)}80%{transform:translate(-1px,1px)}}

/* ---------- NAV ---------- */
#nav{
  position:absolute;left:0;right:0;bottom:0;height:var(--nav-h);display:flex;z-index:40;
  background:linear-gradient(180deg,rgba(17,22,54,.96),rgba(11,15,40,.99));
  border-top:1px solid var(--line);backdrop-filter:blur(6px);
  padding-bottom:env(safe-area-inset-bottom);
}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:1.15rem;color:var(--dim);position:relative;transition:transform .1s}
.navBtn span{font-size:.52rem;font-weight:800;letter-spacing:.02em}
.navBtn.sel{color:var(--pink2);transform:translateY(-2px)}
.navBtn.sel::after{content:"";position:absolute;bottom:4px;width:18px;height:3px;border-radius:2px;background:var(--pink)}
.navBtn .bdg{position:absolute;top:4px;right:50%;margin-right:-20px;min-width:15px;height:15px;border-radius:8px;
  background:var(--red);color:#fff;font-size:.58rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ---------- MODALS / TOASTS ---------- */
#modalWrap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(5,8,24,.72);backdrop-filter:blur(4px);padding:16px}
#modalWrap.open{display:flex}
#modalBox{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;border-radius:22px;padding:16px;
  background:linear-gradient(180deg,#232a6e,#171d4e);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 20px 60px rgba(0,0,0,.6);animation:popIn .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}}
.modalTitle{font-size:1.1rem;font-weight:900;text-align:center;margin-bottom:8px}
.modalBody{font-size:.85rem;color:var(--text)}
.modalBtns{display:flex;gap:8px;margin-top:14px}
.modalBtns .btn{flex:1}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 12px);z-index:80;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:linear-gradient(180deg,#2b3487,#1e2560);border:1px solid rgba(255,255,255,.2);
  padding:8px 14px;border-radius:14px;font-size:.78rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);
  animation:toastIn .3s ease,toastOut .4s ease 3.4s forwards;text-align:center}
@keyframes toastIn{from{transform:translateY(14px);opacity:0}}
@keyframes toastOut{to{transform:translateY(8px);opacity:0}}

/* ---------- TASKS / ACHIEVEMENTS ---------- */
.taskRow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.taskRow:last-child{border-bottom:none}
.taskInfo{flex:1;min-width:0}
.taskName{font-size:.8rem;font-weight:800}
.taskProg{height:7px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:4px}
.taskProg i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .3s}
.taskPct{font-size:.62rem;color:var(--dim);margin-top:2px}
.taskRew{font-size:.7rem;font-weight:800;color:var(--gold2);white-space:nowrap}
.claimBtn{padding:6px 12px;border-radius:11px;font-size:.72rem;font-weight:900}
.achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:8px}
.ach{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;
  background:rgba(0,0,0,.3);border:1px solid var(--line);filter:grayscale(1) brightness(.45)}
.ach.done{filter:none;background:radial-gradient(circle at 35% 30%,rgba(255,215,94,.35),rgba(0,0,0,.25));
  border-color:var(--gold);box-shadow:0 0 6px rgba(255,215,94,.35)}

/* ---------- RESEARCH ---------- */
.labGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.labBranch{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:8px}
.labBranch h4{font-size:.78rem;margin-bottom:6px;display:flex;gap:5px;align-items:center}
.labNode{display:flex;align-items:center;gap:6px;padding:5px;border-radius:11px;margin-bottom:5px;
  background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:.68rem}
.labNode.owned{border-color:var(--mint);background:rgba(61,240,184,.1)}
.labNode.lockedN{opacity:.45}
.labNode .btn{padding:4px 8px;font-size:.62rem;margin-left:auto;border-radius:9px}
.labNode b{display:block;font-size:.7rem}

/* ---------- PRESTIGE ---------- */
.dhBig{text-align:center;padding:12px 0 4px}
.dhBig .v{font-size:2rem;font-weight:900;color:#c8f4ff;text-shadow:0 0 18px rgba(120,220,255,.6)}
.dhGainBar{height:14px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid var(--line);margin:8px 0}
.dhGainBar i{display:block;height:100%;background:linear-gradient(90deg,#7fdcff,#b48cff);transition:width .3s}
.shopItem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.shopItem:last-child{border:none}

'use strict';
/* ============================================================
   SECTION: BIG NUMBERS
   Mantissa/exponent decimal — never Infinity, never NaN.
   ============================================================ */
class D{
  constructor(m=0,e=0){this.m=m;this.e=e;this.norm();}
  static from(x){
    if(x instanceof D) return new D(x.m,x.e);
    if(typeof x==='object'&&x&&typeof x.m==='number') return new D(x.m,x.e|0);
    if(typeof x==='string') x=parseFloat(x)||0;
    if(typeof x!=='number'||!isFinite(x)) x=0;
    return new D(x,0);
  }
  norm(){
    if(!isFinite(this.m)||this.m===0){this.m=0;this.e=0;return this;}
    const a=Math.abs(this.m);
    if(a>=1&&a<10) return this;
    const d=Math.floor(Math.log10(a));
    this.m/=Math.pow(10,d); this.e+=d;
    if(Math.abs(this.m)>=10){this.m/=10;this.e++;}
    if(Math.abs(this.m)<1){this.m*=10;this.e--;}
    return this;
  }
  add(o){o=D.from(o);
    if(this.m===0)return new D(o.m,o.e);
    if(o.m===0)return new D(this.m,this.e);
    if(this.e-o.e>15)return new D(this.m,this.e);
    if(o.e-this.e>15)return new D(o.m,o.e);
    const e=Math.max(this.e,o.e);
    return new D(this.m*Math.pow(10,this.e-e)+o.m*Math.pow(10,o.e-e),e);
  }
  sub(o){o=D.from(o);return this.add(new D(-o.m,o.e));}
  mul(o){o=D.from(o);return new D(this.m*o.m,this.e+o.e);}
  div(o){o=D.from(o);if(o.m===0)return new D(0,0);return new D(this.m/o.m,this.e-o.e);}
  pow(p){
    if(this.m===0)return new D(0,0);
    if(this.m<0)return new D(0,0);
    const l=(Math.log10(this.m)+this.e)*p, e=Math.floor(l);
    return new D(Math.pow(10,l-e),e);
  }
  sqrt(){return this.pow(0.5);}
  cmp(o){o=D.from(o);
    if(this.m===0&&o.m===0)return 0;
    if(this.m===0)return o.m>0?-1:1;
    if(o.m===0)return this.m>0?1:-1;
    if(this.m>0&&o.m<0)return 1;
    if(this.m<0&&o.m>0)return -1;
    const s=this.m>0?1:-1;
    if(this.e!==o.e)return(this.e>o.e?1:-1)*s;
    return this.m===o.m?0:(this.m>o.m?1:-1)*s;
  }
  gte(o){return this.cmp(o)>=0} gt(o){return this.cmp(o)>0}
  lte(o){return this.cmp(o)<=0} lt(o){return this.cmp(o)<0}
  num(){const v=this.m*Math.pow(10,this.e);return isFinite(v)?v:(this.m>0?1e308:-1e308);}
  isZero(){return this.m===0}
}
const D0=()=>new D(0,0);

/* AdCap-style suffixes: K M B T Qa Qi Sx Sp Oc No Dc ... */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc','SxDc','SpDc','OcDc','NoDc','Vg'];
function fmt(x){
  const d=D.from(x);
  if(d.m===0)return'0';
  if(d.m<0)return'-'+fmt(new D(-d.m,d.e));
  if(d.e<3){
    const n=d.num();
    if(n<10&&n!==Math.floor(n))return(Math.floor(n*10)/10).toFixed(1);
    return String(Math.floor(n));
  }
  const t=Math.floor(d.e/3);
  if(t<SUF.length){
    const v=d.m*Math.pow(10,d.e-3*t);
    return(v>=100?v.toFixed(1):v.toFixed(2))+SUF[t];
  }
  return d.m.toFixed(2)+'e'+d.e;
}
function fmtInt(n){return fmt(D.from(Math.floor(n)))}
function fmtTime(s){
  s=Math.max(0,Math.ceil(s));
  if(s<60)return s+'s';
  if(s<3600)return Math.floor(s/60)+'m '+(s%60)+'s';
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(s<86400)return h+'h '+m+'m';
  return Math.floor(s/86400)+'d '+Math.floor(s%86400/3600)+'h';
}

/* Milestone multipliers every N owned — AdCap "unlocks" cadence */
const MS_STEPS=[{c:25,m:2},{c:50,m:2},{c:100,m:3},{c:150,m:2},{c:200,m:5},{c:300,m:3},{c:400,m:3},{c:500,m:5}];
function msMult(cnt){
  let m=1;
  for(const s of MS_STEPS)if(cnt>=s.c)m*=s.m;
  if(cnt>500)m*=Math.pow(3,Math.floor((cnt-500)/100));
  return m;
}
function nextMs(cnt){
  for(const s of MS_STEPS)if(cnt<s.c)return s.c;
  return 500+(Math.floor((cnt-500)/100)+1)*100;
}
function prevMs(cnt){
  let p=0;
  for(const s of MS_STEPS)if(cnt>=s.c)p=s.c;
  if(cnt>500)p=500+Math.floor((cnt-500)/100)*100;
  return p;
}

function eventInfo(now){
  const id=Math.floor(now/EV_CYCLE), start=id*EV_CYCLE;
  return {id,active:(now-start)<EV_LEN,endsAt:start+EV_LEN,nextAt:start+EV_CYCLE,
          theme:EV_THEMES[((id%EV_THEMES.length)+EV_THEMES.length)%EV_THEMES.length]};
}

/* Chibi operator: big head, sparkly eyes, blush, tiny body. */
function chibiSVG(art,cls){
  const hc=art.hc,cc=art.cc,skin='#ffe3d0';
  let hair='',acc='',mouth='';
  switch(art.hair){
    case 'twin':hair=`<circle cx="25" cy="20" r="15" fill="${hc}"/><path d="M10 22 Q4 30 7 40 Q12 36 13 28 Z" fill="${hc}"/><path d="M40 22 Q46 30 43 40 Q38 36 37 28 Z" fill="${hc}"/><circle cx="10.5" cy="21" r="3" fill="#ff4fa0"/><circle cx="39.5" cy="21" r="3" fill="#ff4fa0"/>`;break;

    case 'ears':hair=`<circle cx="25" cy="20" r="15" fill="${hc}"/><path d="M11 12 L8 2 L19 7 Z" fill="${hc}"/><path d="M39 12 L42 2 L31 7 Z" fill="${hc}"/><path d="M12.5 9 L11 4 L16 6.5 Z" fill="#ffb7d9"/><path d="M37.5 9 L39 4 L34 6.5 Z" fill="#ffb7d9"/>`;break;

  }
  const sleepyEyes=art.mouth==='sleepy';
  const eyes=sleepyEyes
    ?`<path d="M17 22.5 Q19.5 24.5 22 22.5 M28 22.5 Q30.5 24.5 33 22.5" stroke="#20264f" stroke-width="1.6" fill="none" stroke-linecap="round"/>`

    case 'glasses':acc=`<circle cx="19.5" cy="22" r="4.6" fill="none" stroke="#eef2ff" stroke-width="1.2"/><circle cx="30.5" cy="22" r="4.6" fill="none" stroke="#eef2ff" stroke-width="1.2"/><path d="M24 22 H26" stroke="#eef2ff" stroke-width="1.2"/>`;break;
    case 'headset':acc=`<path d="M13 20 Q13 9 25 9 Q37 9 37 20" fill="none" stroke="#ffd75e" stroke-width="2"/><rect x="11" y="18" width="4" height="7" rx="2" fill="#ffd75e"/><rect x="35" y="18" width="4" height="7" rx="2" fill="#ffd75e"/>`;break;
    case 'whale':acc=`<path d="M33 36 Q39 32 41 36 Q43 33 45 36 Q45 41 39 41 Q34 41 33 36 Z" fill="#8fd3ff"/><circle cx="38" cy="37.5" r=".8" fill="#20264f"/>`;break;
    case 'crown':acc=`<path d="M17 8 L20 3 L25 7 L30 3 L33 8 Z" fill="#ffd75e" stroke="#ffe9a8"/>`;break;
    case 'wrench':acc=`<g transform="rotate(30 40 36)"><rect x="39" y="30" width="2.2" height="11" rx="1" fill="#9aa3b5"/><circle cx="40" cy="29" r="3" fill="none" stroke="#9aa3b5" stroke-width="2"/></g>`;break;
    case 'sun':acc=`<circle cx="41" cy="10" r="3.4" fill="#ffd75e"/><g stroke="#ffd75e"><path d="M41 4.5 V6 M41 14 V15.5 M35.5 10 H37 M45 10 H46.5"/></g>`;break;
    case 'helmet':acc=`<path d="M14 14 Q14 6 25 6 Q36 6 36 14 L36 16 H14 Z" fill="#ffd75e"/><rect x="22" y="4" width="6" height="4" rx="2" fill="#ffd75e"/>`;break;
    case 'box':acc=`<rect x="34" y="33" width="10" height="8" rx="1.5" fill="#b48a5a" stroke="#8a6f4d"/><path d="M34 36.5 H44" stroke="#8a6f4d"/>`;break;
    case 'petal':acc=`<circle cx="12" cy="10" r="2" fill="#ffb7d9"/><circle cx="40" cy="6" r="1.6" fill="#ffb7d9"/><circle cx="44" cy="16" r="1.3" fill="#ffb7d9"/>`;break;
    case 'visor':acc=`<rect x="13.5" y="18.5" width="23" height="6.5" rx="3" fill="#3df0b8" opacity=".75"/>`;break;
    case 'float':acc=`<circle cx="25" cy="41" r="8" fill="none" stroke="#ff6fb5" stroke-width="3" stroke-dasharray="5 3"/>`;break;
    case 'bunny':acc=`<path d="M15 8 Q13 -4 20 1 Q22 4 19 9 Z" fill="${cc}"/><path d="M35 8 Q37 -4 30 1 Q28 4 31 9 Z" fill="${cc}"/>`;break;
  }
  const body=`<path d="M17 34 Q25 30 33 34 L35 46 Q25 50 15 46 Z" fill="${cc}"/><circle cx="25" cy="38" r="1.4" fill="rgba(255,255,255,.5)"/>`;
  return `<svg class="chibi ${cls||''}" viewBox="0 0 50 52" xmlns="http://www.w3.org/2000/svg">${body}${hair}
  <ellipse cx="16.5" cy="25.5" rx="2.2" ry="1.4" fill="#ffb7c9" opacity=".85"/><ellipse cx="33.5" cy="25.5" rx="2.2" ry="1.4" fill="#ffb7c9" opacity=".85"/>
  ${eyes}${mouth}${acc}</svg>`;
}
</script>
<script>
/* ============================================================
   SECTION: STATE
   ============================================================ */
const SAVE_KEY='cryptomiko_save_v1', SAVE_VERSION=1;
let g=null;            // the one global game state
let sessionStart=Date.now();

function newRig(){return {cnt:0,hash:0,bw:0,wal:0,mgr:false,acct:false,prog:0,run:false};}
function newChainState(idx){
  return {coins:D0(),lifetime:D0(),dh:0,dhClaimed:0,prestiges:0,
    dhShop:{},rigs:CHAINS[idx].rigs.map(()=>newRig())};
}
function dayKey(){return new Date().toDateString();}
function freshState(){
  const s={
    saveVersion:SAVE_VERSION,
    created:Date.now(),lastSaved:Date.now(),
    energy:50,tapsTotal:0,gems:0,shards:0,
    buyAmt:'1',
    settings:{music:0.4,sfx:0.7,muted:false},
    research:{},skins:{},equip:{},
    counters:{day:dayKey(),tapsToday:0,energyToday:0,abilToday:0,rigsToday:0,subToday:0,hireToday:0,
              abilTotal:0,energyTotal:0,subTotal:0},
    dailyClaimed:{},msClaimed:{},achDone:{},
    buffs:[],cooldowns:{},
    chains:[newChainState(0),null,null,null,null],
    active:0,
    event:{id:-1,cur:0,rig:0,claimed:{},pump:null,pumpCd:0},
    sprint:{endsAt:0,cdUntil:0,base:0,startLife:null,best:0,runs:0},
    seenWelcome:false,
  };
  // Design fix #3: brand-new players never lose offline earnings —
  // Miko-chan comes free, pre-assigned to the first rig.
  s.chains[0].rigs[0].cnt=1;
  s.chains[0].rigs[0].mgr=true;
  s.chains[0].rigs[0].prog=CHAINS[0].rigs[0].cyc; // first tap is instantly ready
  return s;
}

/* ============================================================
   SECTION: SAVE / LOAD / MIGRATION / EXPORT
   ============================================================ */
function reviveState(s){
  // Rebuild Dec instances from plain {m,e} objects
  s.chains.forEach((ch,i)=>{ if(!ch)return;
    ch.coins=D.from(ch.coins); ch.lifetime=D.from(ch.lifetime);
  });
  if(s.sprint&&s.sprint.startLife)s.sprint.startLife=D.from(s.sprint.startLife);
  return s;
}
function migrateSave(s){
  // Best-effort forward migration — never silently discard a parseable save.
  if(!s.saveVersion)s.saveVersion=1;
  /* future: if(s.saveVersion===1){ ...transform... s.saveVersion=2; } */
  const f=freshState();
  for(const k of Object.keys(f))if(s[k]===undefined)s[k]=f[k];
  for(const k of Object.keys(f.counters))if(s.counters[k]===undefined)s.counters[k]=f.counters[k];
  if(!s.chains[0])s.chains[0]=newChainState(0);
  while(s.chains[0].rigs.length<CHAINS[0].rigs.length)s.chains[0].rigs.push(newRig());
  s.chains[0].rigs.forEach((r,i)=>{const n=newRig();for(const k of Object.keys(n))if(r[k]===undefined)r[k]=n[k];});
  return s;
}
let saveTimer=0, dirtySave=false;
function save(){
  if(!g)return;
  g.lastSaved=Date.now();
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(g));}catch(e){/* storage full/blocked */}
  dirtySave=false;
}
function queueSave(){dirtySave=true;}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const s=JSON.parse(raw);
    return reviveState(migrateSave(s));
  }catch(e){console.warn('Save could not be parsed — starting fresh, old save preserved under _backup',e);
    try{localStorage.setItem(SAVE_KEY+'_backup',localStorage.getItem(SAVE_KEY));}catch(_){}
    return null;
  }
}
function exportSave(){
  save();
  return btoa(unescape(encodeURIComponent(JSON.stringify(g))));
}
function importSave(str){
  try{
    const s=JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if(!s||typeof s!=='object'||!s.chains)throw new Error('bad save');
    g=reviveState(migrateSave(s));
    save();
    location.reload();
    return true;
  }catch(e){return false;}
}

/* ============================================================
   SECTION: DERIVED STATS (multipliers, energy, offline cap)
   ============================================================ */
function researchSum(field){let v=0;for(const r of RESEARCH)if(g.research[r.id]&&r[field])v+=r[field];return v;}
function researchMax(field){let v=0;for(const r of RESEARCH)if(g.research[r.id]&&r[field])v=Math.max(v,r[field]);return v;}
function dhShopLvlC(c,id){const ch=g.chains[c];return (ch&&ch.dhShop[id])||0;}
function dhShopSum(id){let v=0;for(const ch of g.chains)if(ch)v+=ch.dhShop[id]||0;return v;}
function energyCap(){return 150+researchSum('cap')+dhShopSum('battery')*250;}
function energyRegen(){return 1+researchSum('regen')+dhShopSum('regen')*0.5;}
function offlineCapH(){return Math.max(2,researchMax('off'));}
function cdrMult(){return Math.max(0.3,1-Math.min(0.6,researchSum('cdr')));}
function buffDurMult(){return 1+researchSum('dur');}
function globalBuffMult(){
  let m=1;const now=Date.now();
  for(const b of g.buffs)if(b.r===null&&b.until>now)m*=b.mult;
  return m;
}
function rigBuffMult(c,r){
  let m=1;const now=Date.now();
  for(const b of g.buffs)if(b.c===c&&b.r===r&&b.until>now)m*=b.mult;
  return m;
}
function skinBonus(c,i){
  if(c!==0)return 0;
  let b=0;
  for(const sk of SKINS)if(g.skins[sk.id]&&sk.mgr===i)b+=sk.bonus;
  return b;
}
function chainMult(c){
  const ch=g.chains[c];
  return (1+0.02*ch.dh)                       // Diamond Hands: +2% each, forever
       * (1+researchSum('profit'))            // Blockchain Lab
       * Math.pow(1.25,dhShopLvlC(c,'pickaxe'))  // Golden Pickaxe stacks
       * globalBuffMult();                    // Whale Splash / Pump buffs
}

/* ============================================================
   SECTION: PRODUCTION MATH (3-stage bottleneck inside)
   payout = min( Hash-boosted profit , Cold-Wallet capacity )
   cycle  = base / Bandwidth speed-ups (floored at 0.3s)
   ============================================================ */
function rigDef(c,i){return CHAINS[c].rigs[i];}
function hashF(r){return 1+0.10*r.hash;}
function walF(r){return 1+0.25*r.wal;}
function bwF(r){return 1+0.08*r.bw;}
function cycleTime(c,i){const r=g.chains[c].rigs[i];return Math.max(CYCLE_FLOOR,rigDef(c,i).cyc/bwF(r));}
function rigBaseFactor(c,i){ // shared factor for profit & wallet cap
  const r=g.chains[c].rigs[i];
  return D.from(rigDef(c,i).p).mul(r.cnt).mul(msMult(r.cnt)).mul(chainMult(c)).mul(1+skinBonus(c,i)).mul(rigBuffMult(c,i));
}
function rigCycleProfit(c,i){ // what actually pays: min(hash, wallet)
  const r=g.chains[c].rigs[i];
  const base=rigBaseFactor(c,i);
  const prof=base.mul(hashF(r)), cap=base.mul(walF(r));
  return prof.lte(cap)?prof:cap;
}
function rigRate(c,i){ // per second (managed)
  return rigCycleProfit(c,i).div(cycleTime(c,i));
}
function bottleneck(c,i){
  // per-stage status: g green / y yellow (weakest) / r red (wallet is clamping payouts)
  const r=g.chains[c].rigs[i];
  const clamped=hashF(r)>walF(r)+1e-9;
  const sc={hash:0.10*r.hash,bw:0.08*r.bw,wal:0.25*r.wal};
  let low='hash';
  for(const k of ['bw','wal'])if(sc[k]<sc[low]-1e-9)low=k;
  const spread=Math.max(sc.hash,sc.bw,sc.wal)-Math.min(sc.hash,sc.bw,sc.wal);
  const st={hash:'g',bw:'g',wal:'g'};
  if(spread>0.15)st[low]='y';
  if(clamped)st.wal='r';
  // "all green" for milestone purposes needs real investment, not three zeros
  return {st,low,clamped,all:!clamped&&spread<=0.3&&(r.hash+r.bw+r.wal)>=9};
}
function totalRate(c){
  let t=D0();
  const ch=g.chains[c];
  ch.rigs.forEach((r,i)=>{if(r.cnt>0&&r.mgr)t=t.add(rigRate(c,i));});
  return t;
}
function totalRigs(c){return g.chains[c].rigs.reduce((a,r)=>a+r.cnt,0);}

/* ============================================================
   SECTION: EARNING / SPENDING
   ============================================================ */
function addCoins(c,d){
  const ch=g.chains[c];
  ch.coins=ch.coins.add(d);
  ch.lifetime=ch.lifetime.add(d);
}
function spendCoins(c,d){
  const ch=g.chains[c];
  if(ch.coins.lt(d))return false;
  ch.coins=ch.coins.sub(d);
  return true;
}

/* Rig unit purchases — cost ENERGY (AdVenture-Communist style) */
function rigUnitCost(c,i,n){ // cost of unit #n (0-indexed)
  const acct=g.chains[c].rigs[i].acct?0.9:1;
  return rigDef(c,i).e*Math.pow(RIG_GROWTH,n)*acct;
}
function rigBulkCost(c,i,k){ // buy k units starting from current count
  const n=g.chains[c].rigs[i].cnt;
  const base=rigUnitCost(c,i,n);
  return base*(Math.pow(RIG_GROWTH,k)-1)/(RIG_GROWTH-1);
}
function maxAffordable(c,i){
  const n=g.chains[c].rigs[i].cnt;
  const base=rigUnitCost(c,i,n);
  if(g.energy<base)return 0;
  const k=Math.floor(Math.log(g.energy*(RIG_GROWTH-1)/base+1)/Math.log(RIG_GROWTH));
  return Math.max(0,k);
}
function buyAmount(c,i){
  if(g.buyAmt==='max')return Math.max(1,maxAffordable(c,i));
  return parseInt(g.buyAmt,10);
}
function buyRig(c,i){
  const k=g.buyAmt==='max'?maxAffordable(c,i):parseInt(g.buyAmt,10);
  if(k<=0)return false;
  const cost=rigBulkCost(c,i,k);
  if(g.energy<cost)return false;
  const r=g.chains[c].rigs[i];
  const before=r.cnt;
  g.energy-=cost;
  g.counters.energyToday+=cost;g.counters.energyTotal+=cost;
  r.cnt+=k;
  g.counters.rigsToday+=k;
  if(before===0)r.prog=cycleTime(c,i); // fresh rig starts ready to tap
  const crossed=prevMs(r.cnt)>prevMs(before);
  queueSave();
  return {k,cost,crossed};
}

/* Sub-stage upgrades — cost CHAIN COIN */
function subCost(c,i,stage){
  const r=g.chains[c].rigs[i], lv=r[stage];
  const mult={hash:3,bw:4,wal:2.5}[stage];
  return D.from(rigDef(c,i).p).mul(mult).mul(D.from(SUB_GROWTH).pow(lv)).mul(Math.max(1,r.cnt*0.12));
}
function buySub(c,i,stage){
  const cost=subCost(c,i,stage);
  if(!spendCoins(c,cost))return false;
  g.chains[c].rigs[i][stage]++;
  g.counters.subToday++;g.counters.subTotal++;
  queueSave();
  return true;
}

/* Operators — hired with CHAIN COIN */
function hireMgr(c,i){
  const r=g.chains[c].rigs[i];
  if(r.mgr)return false;
  const cost=D.from(mgrDef(c,i).cost);
  if(!spendCoins(c,cost))return false;
  r.mgr=true;g.counters.hireToday++;
  queueSave();
  return true;
}
/* Whale Accountant — costs Diamond Hands, wiped on prestige (AdCap rule) */
function acctCost(i){return 2+i;}
function buyAcct(c,i){
  const r=g.chains[c].rigs[i];
  if(!r.mgr||r.acct)return false;
  const ch=g.chains[c], cost=acctCost(i);
  if(ch.dh<cost)return false;
  ch.dh-=cost;r.acct=true;g.counters.hireToday++;
  queueSave();
  return true;
}

/* Abilities */
function mgrKey(c,i){return c+':'+i;}
function abilReady(c,i){return (g.cooldowns[mgrKey(c,i)]||0)<=Date.now();}
function abilCdLeft(c,i){return Math.max(0,((g.cooldowns[mgrKey(c,i)]||0)-Date.now())/1000);}
function useAbility(c,i){
  const r=g.chains[c].rigs[i];
  if(!r.mgr||!abilReady(c,i))return false;
  const a=mgrDef(c,i).abil;
  const dur=a.dur*buffDurMult()*1000;
  g.buffs.push({c,r:a.global?null:i,mult:a.mult,until:Date.now()+dur,name:a.name});
  g.cooldowns[mgrKey(c,i)]=Date.now()+a.cd*cdrMult()*1000;
  g.counters.abilToday++;g.counters.abilTotal++;
  queueSave();
  return true;
}
function pruneBuffs(){const now=Date.now();g.buffs=g.buffs.filter(b=>b.until>now);}

/* ============================================================
   SECTION: PRESTIGE — DIAMOND HANDS
   dh = sqrt(lifetime/K) − sqrt(previouslyClaimedLifetime/K)
   ============================================================ */
function dhTotalFor(c,life){return Math.floor(life.div(CHAINS[c].K).sqrt().num()*(1+0.1*dhShopLvlC(c,'magnet')));}
function dhGainAvailable(c){
  const ch=g.chains[c];
  return Math.max(0,dhTotalFor(c,ch.lifetime)-ch.dhClaimed);
}
function nextDhAt(c){ // lifetime needed for next +1 DH
  const ch=g.chains[c];
  const nxt=(ch.dhClaimed+dhGainAvailable(c)+1)/(1+0.1*dhShopLvlC(c,'magnet'));
  return D.from(nxt).mul(nxt).mul(CHAINS[c].K);
}
function doPrestige(c){
  const gain=dhGainAvailable(c);
  if(gain<=0)return false;
  const ch=g.chains[c];
  ch.dh+=gain;
  ch.dhClaimed+=gain;
  ch.prestiges++;
  ch.coins=D0();
  ch.rigs=CHAINS[c].rigs.map(()=>newRig());
  // wiped: rig levels, managers, accountants. kept: dh, research, skins, achievements.
  ch.rigs[0].cnt=1+dhShopLvlC(c,'headstart')*10;
  ch.rigs[0].mgr=true; // Miko-chan is forever your friend
  ch.rigs[0].prog=CHAINS[c].rigs[0].cyc;
  g.buffs=g.buffs.filter(b=>b.c!==c);
  for(const k of Object.keys(g.cooldowns))if(k.startsWith(c+':'))delete g.cooldowns[k];
  save();
  return gain;
}
function buyDhShop(c,id){
  const item=DH_SHOP.find(x=>x.id===id), ch=g.chains[c];
  const lvl=dhShopLvlC(c,id);
  if(lvl>=(item.max||99))return false;
  const cost=Math.ceil(item.cost*Math.pow(item.scale||1,lvl));
  if(ch.dh<cost)return false;
  ch.dh-=cost;
  ch.dhShop[id]=lvl+1;
  queueSave();
  return true;
}

/* ============================================================
   SECTION: RESEARCH purchases
   ============================================================ */
function canResearch(r){return !g.research[r.id]&&(!r.req||g.research[r.req])&&g.shards>=r.cost;}
function buyResearch(id){
  const r=RESEARCH.find(x=>x.id===id);
  if(!r||!canResearch(r))return false;
  g.shards-=r.cost;g.research[id]=true;
  queueSave();
  return true;
}

/* ============================================================
   SECTION: OFFLINE EARNINGS
   Only managed rigs earn. Capped (2h base → 24h researched).
   ============================================================ */
function computeOffline(elapsedSec){
  const cap=offlineCapH()*3600;
  const t=Math.min(elapsedSec,cap);
  const res={t,total:D0(),perChain:[]};
  g.chains.forEach((ch,c)=>{
    if(!ch)return;
    let sum=D0();
    ch.rigs.forEach((r,i)=>{ if(r.cnt>0&&r.mgr)sum=sum.add(rigRate(c,i).mul(t)); });
    if(!sum.isZero()){addCoins(c,sum);res.perChain.push({c,sum});res.total=res.total.add(sum);}
  });
  // Energy regenerates the whole time away (up to cap)
  g.energy=Math.min(energyCap(),g.energy+energyRegen()*elapsedSec);
  return res;
}
</script>
<script>
/* ============================================================
   SECTION: GAME LOOP / TICK
   Fixed-tick simulation decoupled from render; interval fallback
   keeps ticking while tab is backgrounded.
   ============================================================ */
const TICK=0.1;
let lastFrame=performance.now(), acc=0;

function tick(dt){
  g.playSec=(g.playSec||0)+dt;
  // Energy regen (never above cap; reward overfills stay until spent)
  if(g.energy<energyCap())g.energy=Math.min(energyCap(),g.energy+energyRegen()*dt);

  // Rig production
  g.chains.forEach((ch,c)=>{
    if(!ch)return;
    ch.rigs.forEach((r,i)=>{
      if(r.cnt<=0)return;
      const cyc=cycleTime(c,i);
      if(r.mgr){
        r.prog+=dt;
        if(r.prog>=cyc){
          const n=Math.floor(r.prog/cyc);
          r.prog-=n*cyc;
          const pay=rigCycleProfit(c,i).mul(n);
          addCoins(c,pay);
          onPayout(c,i,pay,n);
        }
      }else{
        // unmanaged: cycle charges up, waits for a tap to collect
        if(r.prog<cyc)r.prog=Math.min(cyc,r.prog+dt);
      }
    });
  });

  // Event reactor produces event-coin passively
  const ev=eventInfo(Date.now());
  if(ev.active&&g.event.id===ev.id&&g.event.rig>0){
    g.event.cur+=g.event.rig*0.6*dt;
  }

  pruneBuffs();
  checkDailyRollover();
  checkSprintEnd();
  ensureEvent();
  if(g.event.pump)resolvePump();
  checkAchievements(dt);

  // Layer2 unlock — a whole new parallel economy goes live
  if(!g.chains[1]&&CHAINS[1].rigs.length&&g.chains[0].lifetime.gte(CHAINS[1].unlockLife)){
    g.chains[1]=newChainState(1);
    g.chains[1].rigs[0].cnt=1;
    g.chains[1].rigs[0].mgr=true; // Shiba-chan comes free, same as Miko-chan
    g.chains[1].rigs[0].prog=CHAINS[1].rigs[0].cyc;
    toast('🌙 LAYER2 CHAIN UNLOCKED! Switch over from the Chains tab!');
    confettiBig();sfxPrestige();
    ui.dirty.chains=true;
    queueSave();
  }

  // autosave every 10s + when flagged dirty (min 1.5s apart)
  saveTimer+=dt;
  if(saveTimer>=10||(dirtySave&&saveTimer>=1.5)){saveTimer=0;save();}
}

/* payout hook → floaty numbers + operator bounce (throttled) */
let lastFloat={};
function onPayout(c,i,pay,n){
  const now=performance.now();
  if(c===act()&&ui.screen==='miners'&&rigEls[i]&&(!lastFloat[i]||now-lastFloat[i]>900)){
    lastFloat[i]=now;
    bounceOp(i);
  }
}

/* Manual tap: collects a ready cycle (or fast-forwards a managed one) */
function tapRig(c,i,x,y){
  const r=g.chains[c].rigs[i];
  if(r.cnt<=0)return;
  const cyc=cycleTime(c,i);
  g.tapsTotal++;g.counters.tapsToday++;
  if(r.prog>=cyc||r.mgr){
    // tap completes the current cycle instantly and pays out in full
    const pay=rigCycleProfit(c,i);
    addCoins(c,pay);
    r.prog=0;
    sfxTap();
    floatText(x,y,'+'+fmt(pay)+' '+CHAINS[c].sym);
    burst(x,y,6,['#ffd75e','#ff6fb5','#3df0b8']);
    bounceOp(i);
  }else{
    sfxTapDud();
  }
}

/* ============================================================
   SECTION: DAILY TASKS / MILESTONES / ACHIEVEMENTS
   ============================================================ */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function todaysDailies(){
  const days=Math.floor(Date.now()/86400000);
  const rnd=mulberry(days*7919);
  const pool=[...DAILY_POOL], out=[];
  while(out.length<4&&pool.length)out.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);
  return out;
}
function checkDailyRollover(){
  if(g.counters.day!==dayKey()){
    g.counters.day=dayKey();
    g.counters.tapsToday=0;g.counters.energyToday=0;g.counters.abilToday=0;
    g.counters.rigsToday=0;g.counters.subToday=0;g.counters.hireToday=0;
    g.dailyClaimed={};
    toast('🌸 New Daily Tasks are in!');
    ui.dirty.tasks=true;
    queueSave();
  }
}
function grantRew(rew,src){
  const bits=[];
  if(rew.energy){g.energy+=rew.energy;bits.push('+'+rew.energy+' ⚡');}
  if(rew.gems){g.gems+=rew.gems;bits.push('+'+rew.gems+' 💠');}
  if(rew.shards){g.shards+=rew.shards;bits.push('+'+rew.shards+' 🔬');}
  if(rew.skin&&!g.skins[rew.skin]){g.skins[rew.skin]=true;bits.push('👘 '+SKINS.find(s=>s.id===rew.skin).name);}
  toast((src?src+' — ':'')+bits.join('  '));
  queueSave();
  return bits;
}
function claimDaily(id){
  const t=DAILY_POOL.find(x=>x.id===id);
  if(!t||g.dailyClaimed[id]||t.val(g)<t.t)return false;
  g.dailyClaimed[id]=true;
  grantRew(t.rew,'✅ '+t.name);

}
function claimMilestone(id){
  const t=MILESTONE_TASKS.find(x=>x.id===id);
  if(!t||g.msClaimed[id]||!t.chk(g))return false;
  g.msClaimed[id]=true;
  grantRew(t.rew,'🏆 '+t.name);
  sfxMilestone();confettiBig();

}
let achTimer=0;
function checkAchievements(dt){
  achTimer+=dt;
  if(achTimer<1)return;achTimer=0;
  for(const a of ACHS){
    if(g.achDone[a.id])continue;
    let ok=false;
    try{ok=a.chk(g);}catch(e){}
    if(ok){
      g.achDone[a.id]=true;
      g.shards+=a.shards;

    ui.dirty.ops=true;ui.dirty.shop=true;

}

/* ============================================================
   SECTION: AUDIO — Web Audio API synth (no external assets)
   soft kawaii pops/chimes + generative lo-fi background loop
   ============================================================ */
const AU={ctx:null,master:null,sfx:null,music:null,started:false,tapCombo:0,lastTap:0,musTimer:null,bar:0};
function auInit(){
  if(AU.ctx)return;
  try{
    AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);
    AU.sfx=AU.ctx.createGain();AU.sfx.connect(AU.master);
    AU.music=AU.ctx.createGain();AU.music.connect(AU.master);
    applyVolumes();
    startMusic();
  }catch(e){}
}
function applyVolumes(){
  if(!AU.ctx)return;
  AU.master.gain.value=g.settings.muted?0:1;
  AU.sfx.gain.value=g.settings.sfx;
  AU.music.gain.value=g.settings.music*0.5;
}
function tone(freq,dur,type,vol,when,dest,slide){
  if(!AU.ctx)return;
  const t0=AU.ctx.currentTime+(when||0);
  const o=AU.ctx.createOscillator(),gn=AU.ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(1,freq*slide),t0+dur);
  gn.gain.setValueAtTime(0,t0);
  gn.gain.linearRampToValueAtTime(vol,t0+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(gn);gn.connect(dest||AU.sfx);
  o.start(t0);o.stop(t0+dur+0.05);
}
function noiseBurst(dur,vol,when,freq){
  if(!AU.ctx)return;
  const t0=AU.ctx.currentTime+(when||0);
  const len=Math.floor(AU.ctx.sampleRate*dur);
  const buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AU.ctx.createBufferSource();src.buffer=buf;
  const f=AU.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;f.Q.value=1.2;
  const gn=AU.ctx.createGain();gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f);f.connect(gn);gn.connect(AU.sfx);
  src.start(t0);
}
/* rising-pitch combo pop, resets after 0.8s idle */
function sfxTap(){
  if(!AU.ctx)return;
  const now=performance.now();
  AU.tapCombo=(now-AU.lastTap<800)?Math.min(AU.tapCombo+1,12):0;
  AU.lastTap=now;
  const f=620*Math.pow(1.035,AU.tapCombo);
  tone(f,0.09,'sine',0.35,0,AU.sfx,1.35);
  tone(f*2,0.05,'triangle',0.10);
}
function sfxTapDud(){tone(180,0.06,'sine',0.12);}
function sfxBuy(){ // warm two-note major third, marimba-ish
  tone(523.25,0.14,'triangle',0.32);
  tone(659.25,0.18,'triangle',0.30,0.09);
  tone(1046.5,0.10,'sine',0.10,0.09);
}
function sfxMilestone(){ // bright music-box arpeggio
  [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{
    tone(f,0.30,'sine',0.26,i*0.07);
    tone(f*2,0.16,'sine',0.07,i*0.07);
  });
}
function sfxAbility(){
  noiseBurst(0.25,0.20,0,2400);
  tone(880,0.20,'sine',0.22,0.05,AU.sfx,1.5);
  tone(1318.5,0.25,'sine',0.16,0.12);
}
function sfxPrestige(){
  noiseBurst(0.7,0.22,0,600);
  [392,523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.5,'triangle',0.22,0.1+i*0.09));
}
function sfxWelcome(){
  [523.25,587.33,659.25,783.99].forEach((f,i)=>tone(f,0.4,'sine',0.18,i*0.13,AU.sfx,1.02));
}
/* generative chillhop-ish loop: soft pads + pentatonic plucks, 2 patterns */
const MUS={prog:[[[261.63,329.63,392,493.88],[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392]],
                 [[220,277.18,329.63,415.3],[174.61,220,261.63,349.23],[146.83,185,220,293.66],[196,246.94,293.66,392]]],
           pent:[261.63,293.66,329.63,392,440,523.25,587.33,659.25]};
function startMusic(){
  if(AU.musTimer)return;
  let nextBar=AU.ctx.currentTime+0.1;
  AU.musTimer=setInterval(()=>{
    if(!AU.ctx)return;
    if(nextBar<AU.ctx.currentTime)nextBar=AU.ctx.currentTime+0.05; // never schedule into the past
    while(nextBar<AU.ctx.currentTime+0.6){
      const silent=g.settings.muted||g.settings.music<=0.01;
      if(!silent){
        const track=Math.floor(AU.bar/16)%2;
        const chord=MUS.prog[track][AU.bar%4];
        const when=nextBar-AU.ctx.currentTime;
        chord.forEach(f=>{ // pad
          tone(f/2,1.9,'triangle',0.05,when,AU.music);
          tone(f,1.9,'sine',0.028,when,AU.music);
        });
        tone(chord[0]/4,0.5,'sine',0.09,when,AU.music); // soft bass
        for(let e=0;e<4;e++){ // sparse pluck melody
          if(Math.random()<0.42){
            const n=MUS.pent[Math.floor(Math.random()*MUS.pent.length)]*(track?1:2);
            tone(n,0.22,'sine',0.05,when+e*0.5+(Math.random()<.3?0.25:0),AU.music);
          }
        }
      }
      nextBar+=2.0;AU.bar++;
    }
  },400);
}

/* ============================================================
   SECTION: FX — canvas particles, confetti, floating text
   ============================================================ */
const fxCv=document.getElementById('fx'),fxCtx=fxCv.getContext('2d');
let parts=[];
function fxResize(){fxCv.width=innerWidth;fxCv.height=innerHeight;}
addEventListener('resize',fxResize);fxResize();
function burst(x,y,n,colors){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=60+Math.random()*160;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,life:0.7+Math.random()*0.4,age:0,
      c:colors[i%colors.length],s:2.5+Math.random()*3.5,shape:Math.random()<0.4?'r':'c'});
  }
  if(parts.length>420)parts.splice(0,parts.length-420);
}
function confettiBig(){
  for(let i=0;i<90;i++){
    parts.push({x:Math.random()*fxCv.width,y:-12-Math.random()*60,
      vx:(Math.random()-0.5)*70,vy:110+Math.random()*160,life:2.1+Math.random(),age:0,
      c:['#ffd75e','#ff6fb5','#3df0b8','#6fa8ff','#b48cff'][i%5],s:3+Math.random()*4,shape:'r',spin:Math.random()*6});
  }
  document.getElementById('app').classList.remove('shakeLite');
  void document.getElementById('app').offsetWidth;
  document.getElementById('app').classList.add('shakeLite');
}
function fxStep(dt){
  if(!parts.length){fxCtx.clearRect(0,0,fxCv.width,fxCv.height);return;}
  fxCtx.clearRect(0,0,fxCv.width,fxCv.height);
  parts=parts.filter(p=>{
    p.age+=dt;if(p.age>=p.life)return false;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;
    const a=1-p.age/p.life;
    fxCtx.globalAlpha=a;fxCtx.fillStyle=p.c;
    if(p.shape==='r'){
      fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate((p.spin||2)*p.age);
      fxCtx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);fxCtx.restore();
    }else{
      fxCtx.beginPath();fxCtx.arc(p.x,p.y,p.s*a,0,7);fxCtx.fill();
    }
    return true;
  });
  fxCtx.globalAlpha=1;
}
function floatText(x,y,txt,cls){
  const el=document.createElement('div');
  el.className='floatTxt '+(cls||'');
  el.textContent=txt;
  const app=document.getElementById('app').getBoundingClientRect();
  el.style.left=Math.max(4,Math.min(app.width-90,x-app.left-30))+'px';
  el.style.top=(y-app.top-20)+'px';
  document.getElementById('floats').appendChild(el);
  setTimeout(()=>el.remove(),1050);
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  const box=document.getElementById('toasts');
  box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>t.remove(),3900);
}
</script>

/* ============================================================

function buildMiners(){

  const showN=Math.min(rigs.length,firstLocked+1);

function updateMiners(force){
  if(ui.screen!=='miners'&&!force)return;
  const c=act();
  const rate=totalRate(c);
  const cr=$('chainRate');if(cr)cr.textContent='+'+fmt(rate)+' '+CHAINS[c].sym+'/s';
  rigEls.forEach(E=>{
    if(!E)return;
    const i=E.i,r=g.chains[c].rigs[i];
    E.cnt.textContent='× '+r.cnt;
    E.art.classList.toggle('tier1',r.cnt>=25&&r.cnt<100);
    E.art.classList.toggle('tier2',r.cnt>=100);
    if(r.mgr){E.prof.textContent=fmt(rigRate(c,i));E.per.textContent=CHAINS[c].sym+'/sec';}
    else{E.prof.textContent=fmt(rigCycleProfit(c,i));E.per.textContent=CHAINS[c].sym+'/cycle · '+cycleTime(c,i).toFixed(1)+'s';}
    const p=prevMs(r.cnt),n=nextMs(r.cnt);
    E.ms.style.width=Math.min(100,(r.cnt-p)/(n-p)*100)+'%';
    E.msl.textContent=r.cnt+' / '+n+' → ×'+(msMult(n)/msMult(r.cnt))+' profit';
    const bn=bottleneck(c,i);
    ['hash','bw','wal'].forEach(k=>{
      E.dots[k].className='dot '+bn.st[k];
      E.lvs[k].textContent='Lv '+r[k];
      const cost=subCost(c,i,k);
      E.ups[k].textContent='▲ '+fmt(cost);
      E.ups[k].classList.toggle('can',g.chains[c].coins.gte(cost));
      E.ups[k].classList.toggle('off',!g.chains[c].coins.gte(cost));
    });
    const k=g.buyAmt==='max'?maxAffordable(c,i):parseInt(g.buyAmt,10);
    const kk=Math.max(1,k),cost=rigBulkCost(c,i,kk);
    E.buy.innerHTML='BUY ×'+kk+'<span class="cost">⚡ '+fmtInt(Math.ceil(cost))+'</span>';
    const can=g.energy>=cost&&(g.buyAmt!=='max'||k>0);
    E.buy.classList.toggle('mint',can);E.buy.classList.toggle('off',!can);
    // ability chip
    if(r.mgr){
      E.abil.style.display='flex';
      if(abilReady(c,i)){E.abil.className='abilBtn';E.abil.textContent='✨';E.abil.title=mgrDef(c,i).abil.name;}
      else{E.abil.className='abilBtn cd';E.abil.textContent=Math.ceil(abilCdLeft(c,i))+'';}
    }
  });
}
function updateRings(){
  if(ui.screen!=='miners')return;
  const c=act();
  rigEls.forEach(E=>{
    if(!E)return;
    const r=g.chains[c].rigs[E.i],cyc=cycleTime(c,E.i);
    const pct=Math.min(1,r.prog/cyc)*100;
    E.tap.style.setProperty('--p',r.mgr?pct:pct);
    E.tap.classList.toggle('ready',!r.mgr&&r.prog>=cyc);
    E.tap.classList.toggle('auto',r.mgr);
  });
}

  });

/* ============================================================
   SECTION: MAIN LOOP + INIT
   ============================================================ */
let lastWall=Date.now(),slowAcc=0,badgeAcc=0;
function step(){
  const now=Date.now();
  let dt=(now-lastWall)/1000;lastWall=now;
  if(dt<=0)return;
  if(dt>120)dt=120;
  if(dt>2){tick(dt);acc=0;}
  else{acc+=dt;while(acc>=TICK){tick(TICK);acc-=TICK;}}
}
function frame(){
  requestAnimationFrame(frame);
  const rNow=performance.now(),rdt=Math.min(0.1,(rNow-lastFrame)/1000);
  lastFrame=rNow;
  step();
  fxStep(rdt);
  updateHUD(rdt);
  updateRings();
  slowAcc+=rdt;
  if(slowAcc>=0.13){
    const sdt=slowAcc;slowAcc=0;
    buildScreen(ui.screen); // honors dirty flags
    updateMiners();updateOps();updateTasks();updatePrestige();updateEvents();
  }
  badgeAcc+=rdt;
  if(badgeAcc>=1){
    badgeAcc=0;updateBadges();maybeCandle();
    if(ui.screen==='chains')buildChains();          // keep unlock progress live
    if(ui.screen==='lab'&&ui.dirty.lab)buildScreen('lab');
  }
}
function init(){
  const loaded=load();
  g=loaded||freshState();
  if(loaded){
    const elapsed=(Date.now()-g.lastSaved)/1000;
    if(elapsed>15){
      const res=computeOffline(elapsed);
      if(!res.total.isZero())showWelcome(res,elapsed);
    }
  }else{
    setTimeout(()=>toast('🌸 Miko-chan is auto-mining your first rig — tap ⛏️ to speed things up!'),700);
  }
  hudDisp.coin=D.from(g.chains[act()].coins);
  hudDisp.energy=g.energy;
  ensureEvent();
  go('miners');
  addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  document.addEventListener('pointerdown',()=>{auInit();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();applyVolumes();});
  setInterval(()=>{if(document.hidden)step();},1000);
  requestAnimationFrame(frame);
}
init();
</script>
